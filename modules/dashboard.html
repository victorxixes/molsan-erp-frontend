<!-- ============================================================
     DASHBOARD — MOLSAN ERP
     COMPARATIVA ANUAL
============================================================ -->

<template id="tpl-dashboard">

    <div
        id="dashboard-premium"
        class="modulo-wrapper fade-in dashboard-wrapper"
    >

        <!-- =====================================================
             CABECERA
        ====================================================== -->

        <div class="dashboard-header">

            <div>
                <h2 class="titulo-modulo">
                    📊 Dashboard
                </h2>

                <p class="dashboard-subtitle">
                    Comparativa anual y evolución de la actividad
                </p>
            </div>

        </div>


        <!-- =====================================================
             SELECTORES DE AÑO
        ====================================================== -->

        <div class="dashboard-card dashboard-filtros">

            <div class="dashboard-filter">

                <label for="dash-anio-actual">
                    Año actual
                </label>

                <select id="dash-anio-actual"></select>

            </div>


            <div class="dashboard-filter">

                <label for="dash-anio-anterior">
                    Año anterior
                </label>

                <select id="dash-anio-anterior"></select>

            </div>

        </div>


        <!-- =====================================================
             KPIs PRINCIPALES
        ====================================================== -->

        <div class="dashboard-kpis">

            <!-- FIRMAS -->
            <div class="dashboard-kpi">

                <div class="dashboard-kpi-title">
                    📄 Firmas totales
                </div>

                <div
                    id="dash-total-actual"
                    class="dashboard-kpi-value"
                >
                    -
                </div>

                <div class="dashboard-kpi-previous">
                    Año anterior:
                    <span id="dash-total-anterior">-</span>
                </div>

                <div
                    id="dash-total-diff"
                    class="dashboard-kpi-difference"
                >
                    -
                </div>

            </div>


            <!-- SLA -->
            <div class="dashboard-kpi">

                <div class="dashboard-kpi-title">
                    ⏱ SLA medio
                </div>

                <div
                    id="dash-sla-actual"
                    class="dashboard-kpi-value"
                >
                    -
                </div>

                <div class="dashboard-kpi-previous">
                    Año anterior:
                    <span id="dash-sla-anterior">-</span>
                </div>

                <div
                    id="dash-sla-diff"
                    class="dashboard-kpi-difference"
                >
                    -
                </div>

            </div>


            <!-- VIDEO CONFERENCIA -->
            <div class="dashboard-kpi">

                <div class="dashboard-kpi-title">
                    🎥 % VideoConferencia
                </div>

                <div
                    id="dash-vc-actual"
                    class="dashboard-kpi-value"
                >
                    -
                </div>

                <div class="dashboard-kpi-previous">
                    Año anterior:
                    <span id="dash-vc-anterior">-</span>
                </div>

                <div
                    id="dash-vc-diff"
                    class="dashboard-kpi-difference"
                >
                    -
                </div>

            </div>

        </div>


        <!-- =====================================================
             GRID SECUNDARIO
        ====================================================== -->

        <div class="dash-grid">

            <!-- =================================================
                 KPIs SECUNDARIOS
            ================================================== -->

            <div class="dash-card">

                <h3>
                    📌 KPIs secundarios
                </h3>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Oficina líder
                    </div>

                    <div
                        id="dash-top-oficina"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Circuito dominante
                    </div>

                    <div
                        id="dash-top-circuito"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Tipo gestión dominante
                    </div>

                    <div
                        id="dash-top-gestion"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Apoderado principal
                    </div>

                    <div
                        id="dash-top-apoderado"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Centro que firma
                    </div>

                    <div
                        id="dash-top-centro"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>

            </div>


            <!-- =================================================
                 HIGHLIGHTS
            ================================================== -->

            <div class="dash-card">

                <h3>
                    🔥 Highlights
                </h3>


                <div
                    id="dash-hl-mejor-mes"
                    class="dash-highlight"
                >
                    🔥 Mejor mes: -
                </div>


                <div
                    id="dash-hl-peor-mes"
                    class="dash-highlight"
                >
                    📉 Peor mes: -
                </div>


                <div
                    id="dash-hl-sla-alerta"
                    class="dash-highlight"
                >
                </div>


                <div
                    id="dash-hl-vc-alerta"
                    class="dash-highlight"
                >
                </div>

            </div>


            <!-- =================================================
                 RESUMEN RÁPIDO
            ================================================== -->

            <div class="dash-card">

                <h3>
                    📈 Resumen
                </h3>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Mes más fuerte
                    </div>

                    <div
                        id="dash-top-mes-actual"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Mes más fuerte año anterior
                    </div>

                    <div
                        id="dash-top-mes-anterior"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>


                <div class="dash-metric">

                    <div class="dash-sub">
                        Diferencia
                    </div>

                    <div
                        id="dash-top-mes-diff"
                        class="dash-main"
                    >
                        -
                    </div>

                </div>

            </div>

        </div>


        <!-- =====================================================
             GRÁFICOS
        ====================================================== -->

        <div class="dash-grid dashboard-charts-grid">

            <!-- COMPARATIVA -->
            <div class="dashboard-chart dash-card">

                <h3>
                    📊 Comparativa anual
                </h3>

                <canvas
                    id="dash-chart-comparativa"
                    height="140"
                ></canvas>

            </div>


            <!-- EVOLUCIÓN MENSUAL -->
            <div class="dashboard-chart dash-card">

                <h3>
                    📈 Evolución mensual
                </h3>

                <canvas
                    id="dash-chart-mensual"
                    height="140"
                ></canvas>

            </div>

        </div>


        <!-- =====================================================
             TABLA COMPARATIVA POR PANEL
        ====================================================== -->

        <div class="dashboard-card dashboard-table-card">

            <h3 class="dashboard-section-title">
                📋 Comparativa por panel
            </h3>


            <div class="dashboard-table-wrapper">

                <table class="table-premium table-sticky">

                    <thead>

                        <tr>

                            <th>
                                Panel
                            </th>

                            <th>
                                Año actual
                            </th>

                            <th>
                                Año anterior
                            </th>

                            <th>
                                Diferencia %
                            </th>

                        </tr>

                    </thead>


                    <tbody id="dash-tabla-paneles">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</template>
