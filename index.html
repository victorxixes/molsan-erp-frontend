<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="css/molsan.css">

    <!-- Librerías externas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<body>

<div class="app-shell">

        <li class="menu-item" onclick="cargarModulo('configuracion')">

        <li class="menu-item" onclick="cargarModulo('informes-premium')">

        <!-- PANELES -->

<li class="menu-item" onclick="cargarModulo('panel-tipo-centroquefirma')">
    <span class="icon">🏛️</span>
    <span class="text">Centro que firma</span>
</li>
        <li class="menu-item" onclick="cargarModulo('panel-sla')">

</aside>


    <!-- CONTENEDOR DE MÓDULOS -->
    <main class="app-main">

</div>
<!-- ============================================================
     DASHBOARD — GLASS LUXE 2027 (COMPLETO)
============================================================ -->
<template id="tpl-dashboard">
<div id="dashboard-root" class="modulo-wrapper fade-in dashboard-wrapper">

    <h2 class="titulo-modulo">📊 Dashboard</h2>

    <div class="card-glass p-20">

        <!-- SELECT AÑO -->
        <div class="flex gap-20 mb-20">
            <div>
                <label>Año actual</label>
                <select id="dash-anio-actual"></select>
            </div>

            <div>
                <label>Año anterior</label>
                <select id="dash-anio-anterior"></select>
            </div>
        </div>

        <!-- ============================================================
             BLOQUE DE KPIs — 3 COLUMNAS
        ============================================================= -->
        <div class="dashboard-kpis-wrapper"
             style="display:flex; gap:40px; flex-wrap:wrap; align-items:flex-start;">

            <!-- 🔝 KPIs PRINCIPALES -->
            <div class="card-glass p-20" style="flex:1; min-width:320px;">
                <h3 class="subtitulo-modulo">🔝 KPIs principales</h3>

                <div class="kpi-grid-compare mt-10">

                    <div class="kpi-box-compare">
                        <div class="kpi-title">Firmas totales</div>
                        <div class="kpi-values">
                            <span id="dash-total-actual" class="kpi-big"></span>
                            <span id="dash-total-anterior" class="kpi-small"></span>
                        </div>
                        <div id="dash-total-diff" class="kpi-diff"></div>
                    </div>

                    <div class="kpi-box-compare">
                        <div class="kpi-title">SLA medio</div>
                        <div class="kpi-values">
                            <span id="dash-sla-actual" class="kpi-big"></span>
                            <span id="dash-sla-anterior" class="kpi-small"></span>
                        </div>
                        <div id="dash-sla-diff" class="kpi-diff"></div>
                    </div>

                    <div class="kpi-box-compare">
                        <div class="kpi-title">% VC</div>
                        <div class="kpi-values">
                            <span id="dash-vc-actual" class="kpi-big"></span>
                            <span id="dash-vc-anterior" class="kpi-small"></span>
                        </div>
                        <div id="dash-vc-diff" class="kpi-diff"></div>
                    </div>

                    <div class="kpi-box-compare">
                        <div class="kpi-title">Mes más fuerte</div>
                        <div class="kpi-values">
                            <span id="dash-top-mes-actual" class="kpi-big"></span>
                            <span id="dash-top-mes-anterior" class="kpi-small"></span>
                        </div>
                        <div id="dash-top-mes-diff" class="kpi-diff"></div>
                    </div>

                </div>
            </div>

            <!-- 📌 KPIs SECUNDARIOS -->
            <div class="card-glass p-20" style="flex:1; min-width:320px;">
                <h3 class="subtitulo-modulo">📌 KPIs secundarios</h3>

                <div class="kpi-grid mt-10">

                    <div class="kpi-box">
                        <div class="kpi-title">Oficina líder</div>
                        <div class="kpi-value" id="dash-top-oficina"></div>
                    </div>

                    <div class="kpi-box">
                        <div class="kpi-title">Circuito dominante</div>
                        <div class="kpi-value" id="dash-top-circuito"></div>
                    </div>

                    <div class="kpi-box">
                        <div class="kpi-title">Tipo gestión dominante</div>
                        <div class="kpi-value" id="dash-top-gestion"></div>
                    </div>

                    <div class="kpi-box">
                        <div class="kpi-title">Apoderado top</div>
                        <div class="kpi-value" id="dash-top-apoderado"></div>
                    </div>

                    <div class="kpi-box">
                        <div class="kpi-title">Centro que firma dominante</div>
                        <div class="kpi-value" id="dash-top-centro"></div>
                    </div>

                </div>
            </div>

            <!-- 🔥 HIGHLIGHTS -->
            <div class="card-glass p-20" style="flex:1; min-width:320px;">
                <h3 class="subtitulo-modulo">🔥 Highlights</h3>

                <ul class="mt-10" style="list-style:none; padding-left:0;">
                    <li id="dash-hl-mejor-mes" class="highlight-item"></li>
                    <li id="dash-hl-peor-mes" class="highlight-item"></li>
                    <li id="dash-hl-sla-alerta" class="highlight-item"></li>
                    <li id="dash-hl-vc-alerta" class="highlight-item"></li>
                </ul>
            </div>

        </div>

        <!-- ============================================================
             GRÁFICOS — LADO A LADO
        ============================================================= -->
        <div class="panel-contenido mt-40"
             style="display:flex; justify-content:center; gap:40px; flex-wrap:wrap;">

            <!-- Gráfico comparativa anual -->
            <div style="flex:1; min-width:320px; max-width:480px; text-align:center;">
                <h3 class="subtitulo-modulo">📈 Comparativa anual (actual vs anterior)</h3>
                <canvas id="dash-chart-comparativa" style="width:100%; height:260px;"></canvas>
            </div>

            <!-- Gráfico evolución mensual -->
            <div style="flex:1; min-width:320px; max-width:480px; text-align:center;">
                <h3 class="subtitulo-modulo">📈 Evolución mensual del año actual</h3>
                <canvas id="dash-chart-mensual" style="width:100%; height:260px;"></canvas>
            </div>

        </div>

        <!-- ============================================================
             TABLA RESUMEN DE PANELES
        ============================================================= -->
        <h3 class="mt-40">📊 Comparativa por panel</h3>

        <table class="table-premium table-sticky tabla-center">
            <thead>
                <tr>
                    <th>Panel</th>
                    <th>Año actual</th>
                    <th>Año anterior</th>
                    <th>Diferencia %</th>
                </tr>
            </thead>
            <tbody id="dash-tabla-paneles"></tbody>
        </table>

    </div>

</div>
</template>
    
    <!-- ============================================================
     TEMPLATE LISTADO
============================================================ -->
<template id="tpl-listado">
    <div class="modulo-wrapper fade-in">

        <h2 class="titulo-modulo">📄 Listado de Expedientes</h2>

        <div class="card-glass p-20">

            <!-- Filtros -->
            <div class="filtros-grid">
                <input id="filtroExpediente" placeholder="Expediente">
                <input id="filtroApoderado" placeholder="Apoderado">
                <input id="filtroOficina" placeholder="Oficina">
                <input id="filtroCircuito" placeholder="Circuito">
                <input id="filtroTipoFirma" placeholder="Tipo Firma">
                <input id="filtroMes" placeholder="Mes">
                <input id="filtroAnio" placeholder="Año">
                <input id="filtroDiasMin" placeholder="Días mín">
                <input id="filtroDiasMax" placeholder="Días máx">
            </div>

            <button class="m-btn-soft m-btn-round" onclick="aplicarFiltros()">Aplicar filtros</button>

            <div id="chipsFiltros" class="chips mt-10"></div>

            <!-- Tabla -->
            <div class="tabla-scroll-x mt-20">
                <table class="table-premium table-sticky tabla-listado">
                    <thead>
                        <tr>
                            <th onclick="ordenarPor('expediente')">Expediente</th>
                            <th onclick="ordenarPor('oficina')">Oficina</th>
                            <th onclick="ordenarPor('fecha_alta')">Fecha Alta</th>
                            <th onclick="ordenarPor('contrato')">Contrato</th>
                            <th onclick="ordenarPor('tipo_provision')">Tipo Provisión</th>
                            <th onclick="ordenarPor('notario')">Notario</th>
                            <th>Provincia</th>
                            <th>Municipio</th>
                            <th>Comunidad</th>
                            <th>Protocolo</th>
                            <th onclick="ordenarPor('fecha_protocolo')">Fecha Protocolo</th>
                            <th>V.C.</th>
                            <th onclick="ordenarPor('apoderado')">Apoderado</th>
                            <th>Envio Notario</th>
                            <th onclick="ordenarPor('dias')">Días</th>
                            <th onclick="ordenarPor('mes')">Mes</th>
                            <th onclick="ordenarPor('anio')">Año</th>
                            <th onclick="ordenarPor('centro')">Centro</th>
                            <th>Tipo Gestión</th>
                            <th>Centro que firma</th>
                            <th onclick="ordenarPor('circuito')">Circuito notarial</th>
                            <th onclick="ordenarPor('tipo_firma')">Tipo de firma</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-listado"></tbody>
                </table>
            </div>

            <!-- Paginación -->
            <div class="paginacion mt-20">
                <button id="btnPrev" class="btn-secondary" onclick="paginaAnterior()">Anterior</button>
                <span id="paginaActual"></span>
                <button id="btnNext" class="btn-secondary" onclick="siguientePagina()">Siguiente</button>
            </div>

            <button class="m-btn-soft m-btn-round" onclick="exportarFiltrados()">Exportar CSV</button>

        </div>

    </div>
</template>
    <!-- ============================================================
     TEMPLATE: ACTA REUNION
============================================================ -->

<!-- ============================================================
     TEMPLATE: UPLOADER
============================================================ -->
<template id="tpl-uploader">
    <div class="modulo-wrapper fade-in">

        <h2 class="titulo-modulo">📂 Importar Excel de Firmas</h2>

        <div class="card-glass p-20">

            <p class="texto-secundario">

                <input type="file" id="excelFile" accept=".xlsx,.xls" class="input-file" />

            <button id="btnImportar" class="m-btn m-btn-primary m-btn-sm m-btn-round">

            </button>

            </div>

            <p id="progreso-texto" class="progress-text mt-10"></p>

        </div>
    </div>
</template>

<!-- ============================================================
     TEMPLATE: CONFIGURACIÓN (GLASS LUXE 2027)
============================================================ -->
<template id="tpl-configuracion">
    <div class="modulo-wrapper fade-in">

        <h2 class="titulo-modulo">⚙️ Configuración del Sistema</h2>

        <!-- BLOQUE INFORMACIÓN -->
        <div class="card-glass p-20">

            <p class="texto-secundario">
                La normalización de datos se realiza automáticamente mediante reglas internas
                (Glass Luxe 2027). Los mapas manuales han sido eliminados.
            </p>

            <p class="mt-20">
                Para gestionar permisos del sistema, utiliza el módulo <strong>Permisos</strong>.
            </p>

        </div>

        <!-- BLOQUE MANTENIMIENTO -->
        <div class="card-glass p-20 mt-30">

            <h3 class="subtitulo-modulo">🧹 Mantenimiento del Sistema</h3>
            <p class="mt-10 texto-secundario">
                Herramientas para mantener el ERP limpio y funcionando correctamente.
            </p>

            <button class="m-btn m-btn-danger m-btn-round mt-20"
                    onclick="molsan_resetDB()">
                🧹 Reset datos del sistema
            </button>

        </div>

        <!-- BLOQUE IMPORTACIÓN -->
        <div class="card-glass p-20 mt-30">

            <h3 class="subtitulo-modulo">📥 Importación de Datos</h3>
            <p class="mt-10 texto-secundario">
                Importa un nuevo Excel con firmas para actualizar los informes del ERP.
            </p>

            <button class="m-btn m-btn-primary m-btn-round mt-20"
                    onclick="cargarModulo('uploader')">
                📂 Abrir módulo Importar Excel
            </button>

        </div>

        <!-- BLOQUE PERMISOS -->
        <div class="card-glass p-20 mt-30">

            <h3 class="subtitulo-modulo">🔐 Permisos del Sistema</h3>
            <p class="mt-10 texto-secundario">
                Gestiona los permisos de acceso y acciones disponibles para los usuarios.
            </p>

            <button class="m-btn m-btn-primary m-btn-round mt-20"
                    onclick="cargarModulo('permisos')">
                🔐 Abrir módulo Permisos
            </button>

        </div>

        <!-- BLOQUE BACKUP -->
        <div class="card-glass p-20 mt-30">

            <h3 class="subtitulo-modulo">💾 Copias de Seguridad</h3>
            <p class="mt-10 texto-secundario">
                Genera una copia de seguridad completa del ERP.
            </p>

            <button class="m-btn m-btn-primary m-btn-round mt-20"
                    onclick="cargarModulo('backup')">
                💾 Abrir módulo Backup
            </button>

        </div>

        <!-- BLOQUE RESTAURACIÓN -->
        <div class="card-glass p-20 mt-30">

            <h3 class="subtitulo-modulo">♻️ Restauración de Backups</h3>
            <p class="mt-10 texto-secundario">
                Restaura una copia de seguridad previamente generada.
            </p>

            <button class="m-btn m-btn-primary m-btn-round mt-20"
                    onclick="cargarModulo('restore')">
                ♻️ Abrir módulo Restaurar
            </button>

        </div>

    </div>
</template>

<!-- ============================================================
     PANEL TIPO CENTRO QUE FIRMA — PREMIUM 2027 (FORMATO 2026)
============================================================ -->
<template id="tpl-panel-tipo-centroquefirma">
    <div class="panel-wrapper fade-in">

        <h2 class="titulo-modulo">🏛️ Panel Centro que Firma</h2>

        <!-- Header -->
        <div class="panel-header">
            <div class="panel-header-left">
                <label>Año</label>
                <select id="pcf-select-anio"></select>
            </div>

            <div class="panel-header-right kpi-panel">
                <div class="kpi-card">
                    <div class="kpi-label">Total firmas</div>
                    <div class="kpi-value" id="pcf-kpi-total">0</div>
